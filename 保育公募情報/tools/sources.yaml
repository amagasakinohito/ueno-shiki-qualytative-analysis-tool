# 巡回対象の定義
#
# 監視対象URL一覧.md と対応。ページを追加したいときはここに1エントリ足す。
#
#   city      市名
#   category  区分（保育所 / 児童発達支援 / 学童保育 / 公設民営 / 全般）
#   name      ページ名（レポートにそのまま出る）
#   url       URL
#   priority  high / normal。high はレポートの先頭にまとめて出す
#   selector  （任意）本文領域のCSSセレクタ。指定するとノイズが減る

defaults:
  priority: normal

sources:
