; 保育公募情報 巡回スクリプトの設定
;
; このファイルを config.ini という名前でコピーして、実際の値を入れてください。
; config.ini はパスワードを含むため .gitignore で除外しています。コミットしないでください。

[crawl]
; 1ページ取得するごとに空ける秒数。市のサーバに負荷をかけないため短くしすぎないこと。
delay_seconds = 5
; 1ページあたりのタイムアウト秒数
timeout_seconds = 30
; 一時的な失敗のリトライ回数（2秒→4秒→8秒と待って再試行）
retries = 3
; 連絡先を入れておくと、市の担当者が問い合わせできて親切です。
; ★HTTPヘッダはASCIIしか扱えないため、半角英数字で書いてください（日本語不可）。
user_agent = hoiku-koubo-watch/1.0 (internal monitoring script; contact: example@example.jp)


[garoon]
; ------------------------------------------------------------------
; 接続先
; ------------------------------------------------------------------
; クラウド版は https://(サブドメイン).cybozu.com
; パッケージ版は https://(サーバ名)/(インストール識別子) など環境に合わせて
base_url = https://ainosono.cybozu.com

; 投稿用アカウント。専用のbotアカウントを作ることを推奨します。
login = hoiku-bot
password = ここにパスワード

; 投稿の件名
subject = 保育公募情報 巡回結果


; ------------------------------------------------------------------
; 投稿先エンドポイント
; ------------------------------------------------------------------
; ★ここは環境ごとに異なります。必ず下記で正確な仕様を確認してから設定してください。
;   https://cybozu.dev/ja/garoon/docs/rest-api/
;
; 「電子会議室」がガルーンのどの機能か（掲示板 / スペースのディスカッション /
; メッセージ）によって、指定するパスとボディの形が変わります。
; 下に3パターンの雛形を載せています。使うものだけコメントを外してください。
;
; body_template は JSON です。{subject} と {text} が実際の値に置き換わります。
; （改行や引用符は自動でエスケープされるので、そのまま書いて大丈夫です）

; --- パターン1: スペースのディスカッションにコメントを書き込む -----------
; ガルーンでスペースを開いたときのURLからIDが分かります。
;   https://(サブドメイン).cybozu.com/g/space/top.csp?spid=282#tid=1453
;                                                    ^^^スペースID  ^^^^ディスカッションID
; パスは /space/(スペースID)/ です。/space/spaces/ ではありません。
endpoint = /g/api/v1/space/282/discussions/1453/comments
body_template = {"text": "{text}"}

; もし上記で HTTP 400 が返る場合は、ボディの項目名が違う可能性があります。
; その場合は下記を順に試してください。
; body_template = {"comment": {"text": "{text}"}}
; body_template = {"body": "{text}"}

; --- パターン2: 掲示板に記事を投稿する ---------------------------------
; endpoint = /g/api/v1/bulletin/categories/{カテゴリID}/topics
; body_template = {"subject": "{subject}", "content": {"body": "{text}"}}

; --- パターン3: メッセージを送る ---------------------------------------
; endpoint = /g/api/v1/message/threads
; body_template = {"subject": "{subject}", "body": "{text}", "recipients": [{"type": "USER", "code": "宛先ユーザーコード"}]}

; HTTPメソッド。通常は POST のままで構いません。
method = POST

; 疎通確認（python garoon.py --check）で叩くエンドポイント。
; 既定はユーザー一覧の取得です。権限の都合で使えない場合は変更してください。
probe_endpoint = /g/api/v1/base/users?limit=1


; ------------------------------------------------------------------
; 通信まわり（必要な場合だけ設定）
; ------------------------------------------------------------------
; 1回の投稿に入れる本文の上限文字数。超えると自動で分割投稿します。
max_chars = 10000
timeout_seconds = 30

; cybozu.com でBasic認証を有効にしている場合
; basic_auth_login =
; basic_auth_password =

; cybozu.com のセキュアアクセス（クライアント証明書）を使っている場合。
; 配布されるのは .pfx ですが requests は PEM を要求するため、事前に変換が必要です。
;   openssl pkcs12 -in client.pfx -out client.pem -nodes
; client_cert_path = C:\path\to\client.pem

; 社内プロキシ経由で外部に出る場合
; https_proxy = http://proxy.example.jp:8080
